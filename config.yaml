# Single source of truth for the pipeline. All randomness derives from `seed`.
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: data/processed/models
  docs_dir: docs

sampling:
  interval_minutes: 5          # CGM / wearable resolution

windows:
  history_hours: 6             # model sees the previous 6 h ...
  horizon_hours: 2             # ... to predict events in the next 2 h
  stride_minutes: 30           # spacing between consecutive prediction times
  min_history_coverage: 0.5    # drop windows with < 50 % observed CGM in history
  min_horizon_coverage: 0.5    # drop windows with < 50 % observed CGM in horizon (label unreliable)

thresholds:
  hyper_mgdl: 180              # label = any CGM reading > 180 mg/dL in the horizon
  hypo_mgdl: 70                # label = any CGM reading < 70 mg/dL in the horizon
  nocturnal_start: "22:00"     # nocturnal subset = prediction time in [22:00, 06:00)
  nocturnal_end: "06:00"

simulation:
  n_patients: 300
  n_days: 14
  warmup_days: 1               # simulated then discarded so drug/gut states reach steady state
  start_date: "2026-01-05"
  # Calibration knobs, tuned once so window-level event rates land in the targets below.
  calibration:
    meal_gain: 2.1             # mg/dL rise per gram of absorbed carbohydrate (scaled by insulin resistance)
    drug_effect_scale: 8.0     # multiplies insulin / sulfonylurea glucose-lowering effect
    exercise_scale: 0.010      # direct glucose uptake per 5 min at brisk walking pace
    exercise_drug_boost: 0.8   # post-exercise amplification of drug effect
    titration_exponent: 0.5    # prescriber compensates sensitivity**0.5 of the patient's true drug response
    max_drug_dependence: 1.5   # cap on (untreated / treated basal glucose - 1)
    process_noise_sd: 1.2      # mg/dL per 5 min of unmodelled physiological variability
  target_rates:
    hyper: [0.20, 0.40]
    hypo: [0.03, 0.08]

split:
  test_fraction: 0.20          # by patient, never by row
  val_fraction: 0.15

features:
  meal_rise_mgdl: 20           # meal proxy: CGM rise of >= 20 mg/dL ...
  meal_rise_minutes: 30        # ... within 30 minutes
  active_steps_per_5min: 300   # "active" = brisk walking pace

models:
  lgbm:
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 200     # large leaves: windows from one patient are highly correlated
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    n_estimators: 3000
    early_stopping_rounds: 100
    num_threads: 4

eval:
  false_alert_rates: [0.05, 0.10]   # sensitivity reported at these false-positive rates
  n_bootstrap: 200                  # patient-level bootstrap resamples for 95% CIs

fusion:
  encoder: gru                 # gru | cnn  (1D-CNN is a drop-in swap)
  seq_hidden: 64
  gru_layers: 1
  cnn_channels: 64
  static_hidden: 64
  static_out: 32
  shared_hidden: 64
  dropout: 0.2
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 30
  patience: 5                  # epochs without val improvement before stopping
  hypo_loss: weighted_bce      # weighted_bce (pos_weight = sqrt(neg/pos)) | focal | bce
  focal_gamma: 2.0
  hypo_loss_weight: 1.0        # relative weight of the hypo head in the joint loss
  num_threads: 4

twin:
  model: lgbm_cgm_wearables_ehr   # best hypo model with calibrated probabilities (see docs/ablation_results.md)
  alert_false_alert_rate: 0.05    # alert threshold = 5% false-alert rate on VALIDATION onset windows
  personalise:                    # fitted twin: per-patient parameters from observable data (src/twin/personalise.py)
    fit_days: 7                   # first N days of CGM + meal/dose log used for fitting; the rest is held out
    prior_weight: 5.0             # (mg/dL)^2 penalty per prior SD of departure from the EHR default (chosen on val patients)
    observer_gain: 0.2            # what-if: per-5-min pull of simulated glucose toward observed CGM up to 'now'

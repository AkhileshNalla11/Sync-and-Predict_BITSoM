# Runs on every push and pull request.
#   tests      the full pytest suite on the pinned training stack (requirements.txt, CPU-only PyTorch).
#              Tests that need locally generated pipeline outputs (data/processed) skip themselves here.
#   dashboard  the deployed app on the exact Streamlit Community Cloud dependency set (src/app/requirements.txt,
#              Python 3.14), started from the committed demo bundle.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only PyTorch first, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/app/requirements.txt
      - name: Install the cloud dependency set
        run: |
          sudo apt-get install -y libgomp1
          python -m pip install --upgrade pip
          pip install -r src/app/requirements.txt pytest
      - name: Dashboard runs from the demo bundle
        run: python -m pytest -q tests/test_demo_bundle.py
